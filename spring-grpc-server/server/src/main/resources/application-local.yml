# 개발자 로컬. 이 앱이 자기 자신의 gRPC 서버로 루프백 호출한다.
spring:
  grpc:
    server:
      reflection:
        # grpcurl 로 .proto 없이 호출/describe 하려면 필요하다.
        enabled: true

  # 인메모리 H2. 프로세스가 죽으면 데이터도 사라진다.
  datasource:
    url: jdbc:h2:mem:local-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    # data.sql 을 Hibernate 의 스키마 생성 이후로 미룬다. 기본값(false)이면 테이블이
    # 만들어지기 전에 INSERT 가 실행돼 실패한다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/seed/local-test.sql

sample:
  grpc:
    client:
      host: localhost
      port: ${GRPC_SERVER_PORT:9090}
      # 디버거에서 브레이크포인트에 멈춰도 DEADLINE_EXCEEDED 가 나지 않도록 넉넉히 잡는다.
      timeout-seconds: 30

logging:
  level:
    com.example.springgrpc: DEBUG
    # 개발 중에는 실행되는 SQL 을 본다.
    org.hibernate.SQL: DEBUG
